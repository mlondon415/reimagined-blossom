<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bloom Family Law — Email Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC; --panel:#FFFFFF; --ink:#26332F; --ink-soft:#5C6E68; --rule:#C4B7A0;
    --navy:#2C4550; --navy-dark:#1E323C; --sage:#A9C4B8; --sage-bg:#EEF3EF; --sage-deep:#7FA593;
    --teal:#3F6673; --teal-bg:#E7EDE9; --amber:#96690F; --amber-bg:#FBF1DE; --rust:#A8402F; --rust-bg:#FAEAE6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:
    radial-gradient(ellipse 1000px 500px at 100% 0%, rgba(169,196,184,.16), transparent 60%),
    radial-gradient(ellipse 800px 500px at 0% 100%, rgba(169,196,184,.10), transparent 55%),
    var(--sage-bg);
    color:var(--ink);font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:40px 28px 80px;}
  .brand-footer{text-align:center;padding:18px 20px;background:var(--sage-deep);color:#FFFFFF;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.18em;font-weight:500;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em;}
  .logo{height:52px;width:auto;display:block;margin-bottom:18px;}
  .flourish{display:block;margin:6px 0 14px;}
  .flourish-line{stroke:var(--sage);stroke-width:1;}
  .flourish-leaf{stroke:var(--navy);stroke-width:1;fill:none;}
  .flourish-dot{fill:var(--navy);}
  p.sub{color:var(--ink-soft);font-size:16px;max-width:66ch;line-height:1.55;margin:0;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 8px;flex-wrap:wrap;gap:12px;}
  .search-box{flex:1;min-width:220px;position:relative;}
  .search-box::before{content:'';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:2px solid var(--ink-soft);border-radius:50%;pointer-events:none;}
  .search-box::after{content:'';position:absolute;left:24px;top:calc(50% + 7px);width:7px;height:2px;background:var(--ink-soft);transform:rotate(45deg);pointer-events:none;}
  .search-box input{padding-left:40px;}
  .search-box input{width:100%;padding:12px 16px;border:2px solid var(--rule);border-radius:8px;font-family:'Poppins',sans-serif;font-size:15px;background:#FDFCFA;}

  .quicklinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
  .quicklinks a{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--rule);border-radius:20px;padding:8px 16px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;transition:filter .15s, transform .1s;}
  .quicklinks a:hover{filter:brightness(0.92);transform:translateY(-1px);}
  .quicklinks a::after{content:'↗';font-size:11px;opacity:.6;}
  .manage-link{font-family:'Poppins',sans-serif;font-size:13px;font-weight:600;color:#FFFFFF;background:var(--sage-deep);border:2px solid var(--sage-deep);padding:9px 16px;border-radius:6px;cursor:pointer;white-space:nowrap;}
  .manage-link:hover{background:var(--navy-dark);border-color:var(--navy-dark);}
  .manage-link:hover{border-color:var(--navy);color:var(--navy);}

  .category{margin-top:28px;}
  .category h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--sage);}
  .template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .template-card{background:var(--panel);border:2px solid var(--rule);border-radius:10px;padding:18px;cursor:pointer;transition:border-color .15s, transform .1s, background .15s;}
  .template-card:hover{border-color:var(--sage-deep);background:var(--sage-bg);transform:translateY(-1px);}
  .template-card{display:flex;gap:14px;align-items:flex-start;}

  /* --- Pin/Favorite + Recently Used shelves --- */
  .template-card{position:relative;}
  .pin-btn{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;padding:4px;line-height:0;color:var(--rule);z-index:2;}
  .pin-btn.pinned{color:#D4A72C;}
  .pin-btn svg{width:18px;height:18px;display:block;}
  .shelf-section{margin-bottom:28px;}
  .shelf-title{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
  .tcard-icon{flex-shrink:0;width:44px;height:44px;border-radius:50%;background:var(--sage-bg);display:flex;align-items:center;justify-content:center;color:var(--sage-deep);}
  .tcard-icon-svg{width:20px;height:20px;}
  .tcard-body{min-width:0;flex:1;}
  .template-card .tname{font-weight:600;font-size:15px;margin-bottom:6px;}
  .template-card .tsubject{font-size:13px;color:var(--ink-soft);line-height:1.4;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(38,51,47,.45);z-index:50;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--panel);border-radius:14px;max-width:640px;width:100%;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .modal-head h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;margin:0;}
  .modal-close{background:transparent;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:0 4px;}
  .modal-close:hover{color:var(--rust);}
  .modal-cat{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:18px;}

  .field-group{margin-bottom:16px;}
  .field-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field-group input[type=text], .field-group input[type=email]{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;background:#FDFCFA;}
  .fillins{background:var(--amber-bg);border:1px solid var(--amber);border-radius:8px;padding:14px 16px;margin-bottom:18px;}
  .fillins .fillins-title{font-size:12px;font-weight:600;color:var(--amber);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;font-family:'JetBrains Mono',monospace;}
  .fillins .field-group{margin-bottom:10px;}
  .fillins .field-group:last-child{margin-bottom:0;}

  .preview{border:1px solid var(--rule);border-radius:8px;padding:16px;background:#FBFAF6;margin-bottom:20px;}
  .preview .psubject{font-weight:600;font-size:14px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--rule);}
  .preview .pbody{font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink);max-height:280px;overflow-y:auto;}
  .placeholder-fill{background:#FBE8A6;padding:1px 3px;border-radius:3px;}

  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;}
  button.primary{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:13px 22px;font-size:15px;font-weight:600;font-family:'Poppins',sans-serif;cursor:pointer;flex:1;min-width:180px;}
  button.primary:hover{background:var(--navy-dark);}
  button.secondary{background:transparent;border:1px solid var(--navy);color:var(--navy);border-radius:8px;padding:13px 18px;font-size:14px;font-weight:600;font-family:'Poppins',sans-serif;cursor:pointer;}
  button.secondary:hover{background:var(--navy);color:#fff;}
  .copied-msg{font-size:12px;color:var(--teal);margin-top:8px;display:none;}

  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:15px;}
  .header-flex{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;}
  .header-text{flex:1;min-width:0;}
</style>
</head>

  <div class="modal" id="modalContent"></div>
</div>
<script>
// Default templates baked in as a fallback — used only if templates.json
// can't be fetched (e.g. opened as a local file instead of via a real URL).
const DEFAULT_TEMPLATES = {"attorneys":[],"senders":[],"alwaysBcc":[],"categories":[{"name":"Initial Outreach & Scheduling","templates":[{"id":"invite-consult","name":"Consultation Invite","subject":"Thank you for reaching out — let's schedule your free consultation","body":"Hi [Client First Name],\n\nThank you for reaching out to Bloom Family Law. We'd love the opportunity to speak with you and answer your questions.\n\nYou can pick a time that works for you here:\n[Scheduling Link]\n\nIf you have any trouble finding a time, just reply to this email and we'll help you get scheduled.\n\nWe look forward to speaking with you.\n\n[Signature]"}]}]};

let DATA = null;

// ============================================================
// Pinned favorites + recently used (per-browser, via localStorage)
// ============================================================
const PINNED_KEY = 'bloomEmailTemplates_pinned';
const RECENT_KEY = 'bloomEmailTemplates_recent';
const MAX_RECENT = 6;

function readStore(key){
  try {
    const raw = window.localStorage ? window.localStorage.getItem(key) : null;
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){ return []; }
}
function writeStore(key, arr){
  try { if (window.localStorage) window.localStorage.setItem(key, JSON.stringify(arr)); }
  catch(e){ /* storage unavailable — fail silently, feature just won't persist */ }
}
function templateKey(catName, id){ return catName + '::' + id; }
function getPinned(){ return readStore(PINNED_KEY); }
function isPinned(catName, id){ return getPinned().indexOf(templateKey(catName, id)) !== -1; }
function togglePin(catName, id, event){
  if (event && event.stopPropagation) event.stopPropagation();
  const key = templateKey(catName, id);
  let pinned = getPinned();
  if (pinned.indexOf(key) !== -1){
    pinned = pinned.filter(function(k){ return k !== key; });
  } else {
    pinned = pinned.concat([key]);
  }
  writeStore(PINNED_KEY, pinned);
  renderTemplates();
}
function getRecent(){ return readStore(RECENT_KEY); }
function recordRecent(catName, id){
  const key = templateKey(catName, id);
  let recent = getRecent().filter(function(k){ return k !== key; });
  recent.unshift(key);
  writeStore(RECENT_KEY, recent.slice(0, MAX_RECENT));
}
function findTemplateByKey(key){
  const idx = key.lastIndexOf('::');
  if (idx === -1) return null;
  const catName = key.slice(0, idx), id = key.slice(idx + 2);
  const t = findTemplate(catName, id);
  return t ? { t: t, catName: catName } : null;
}
function starIconSvg(filled){
  return filled
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>';
}
function pinBtnHtml(catName, id){
  const pinned = isPinned(catName, id);
  return '<button class="pin-btn' + (pinned ? ' pinned' : '') + '" title="' + (pinned ? 'Unpin' : 'Pin as favorite') +
    '" onclick="togglePin(\'' + esc(catName) + '\',\'' + esc(id) + '\',event)">' + starIconSvg(pinned) + '</button>';
}

let currentTemplate = null;
let currentFillIns = {};

function loadTemplates(){
  fetch('templates.json', {cache:'no-store'})
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(json => { DATA = json; renderTemplates(); renderQuickLinks(); })
    .catch(() => { DATA = DEFAULT_TEMPLATES; renderTemplates(); renderQuickLinks(); });
}
loadTemplates();

function renderQuickLinks(){
  const host = document.getElementById('quickLinksBar');
  const links = (DATA && DATA.quickLinks) || [];
  host.innerHTML = links.map(l => {
    const color = l.color || '#DDD5C2';
    return `<a href="${esc(l.url)}" target="_blank" rel="noopener" style="background:${esc(color)}33;border-color:${esc(color)};">${esc(l.name)}</a>`;
  }).join('');
}

function extractPlaceholders(text){
  const matches = [...text.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  return [...new Set(matches)];
}

function applyFillIns(text, fillIns){
  let out = text;
  Object.keys(fillIns).forEach(key => {
    const val = fillIns[key];
    if (val) out = out.split('[' + key + ']').join(val);
  });
  return out;
}

const CATEGORY_ICONS = {
  "Initial Outreach & Scheduling": `<path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l9 6l9-6"/>`,
  "Follow-Up": `<path d="M17.65 6.35A8 8 0 1 0 19 13"/><polyline points="19 4 19 9 14 9"/>`,
  "Decision & Next Steps": `<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><polyline points="9 15 11 17 15 13"/>`,
  "Client Care & Milestones": `<path d="M12 21s-6.5-4.35-9-8.5C1.5 9 3 5.5 6.5 5.5c2 0 3.5 1.5 4 3c.5-1.5 2-3 4-3c3.5 0 5 3.5 3 7c-2.5 4.15-9 8.5-9 8.5z"/>`,
  "Internal Emails": `<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>`,
};
const DEFAULT_ICON = CATEGORY_ICONS["Initial Outreach & Scheduling"];

function categoryIconSvg(catName){
  const inner = CATEGORY_ICONS[catName] || DEFAULT_ICON;
  return `<svg class="tcard-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

function cardSubjectText(t){
  if (t.subject) return t.subject;
  if (t.variants) return `${t.variants.length} options — pick one when you open it`;
  return '';
}

function templateCardHtml(catName, t){
  return `
    <div class="template-card" onclick="openTemplate('${esc(catName)}','${t.id}')">
      ${pinBtnHtml(catName, t.id)}
      <div class="tcard-icon">${categoryIconSvg(catName)}</div>
      <div class="tcard-body">
        <div class="tname">${esc(t.name)}</div>
        <div class="tsubject">${esc(cardSubjectText(t))}</div>
      </div>
    </div>
  `;
}

function renderTemplates(){
  if (!DATA) return;
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const host = document.getElementById('templateList');
  let anyResults = false;

  const matchesQuery = (t) => {
    if (!q) return true;
    if (t.name.toLowerCase().includes(q)) return true;
    if (t.subject && t.subject.toLowerCase().includes(q)) return true;
    if (t.variants && t.variants.some(v => v.name.toLowerCase().includes(q) || v.subject.toLowerCase().includes(q))) return true;
    return false;
  };

  // Pinned + Recently Used shelves — only when not actively searching, so
  // they don't clutter filtered search results.
  let shelvesHtml = '';
  if (!q){
    const pinnedKeys = getPinned();
    const pinnedItems = pinnedKeys.map(findTemplateByKey).filter(Boolean);
    if (pinnedItems.length){
      shelvesHtml += `<div class="shelf-section">
        <div class="shelf-title">★ Pinned</div>
        <div class="template-grid">${pinnedItems.map(x => templateCardHtml(x.catName, x.t)).join('')}</div>
      </div>`;
    }
    const recentKeys = getRecent().filter(k => pinnedKeys.indexOf(k) === -1);
    const recentItems = recentKeys.map(findTemplateByKey).filter(Boolean);
    if (recentItems.length){
      shelvesHtml += `<div class="shelf-section">
        <div class="shelf-title">Recently Used</div>
        <div class="template-grid">${recentItems.map(x => templateCardHtml(x.catName, x.t)).join('')}</div>
      </div>`;
    }
  }

  const html = DATA.categories.map(cat => {
    const templates = cat.templates.filter(matchesQuery);
    if (!templates.length) return '';
    anyResults = true;
    return `<div class="category">
      <h2>${esc(cat.name)}</h2>
      <div class="template-grid">
        ${templates.map(t => templateCardHtml(cat.name, t)).join('')}
      </div>

    </div>`;
  }).join('');

  host.innerHTML = (shelvesHtml || anyResults) ? (shelvesHtml + html) : `<div class="empty-state">No templates match "${esc(q)}".</div>`;
}

function findTemplate(catName, id){
  const cat = DATA.categories.find(c => c.name === catName);
  if (!cat) return null;
  return cat.templates.find(t => t.id === id);
}
</script>
<script>
function esc(v){ return String(v===undefined||v===null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// These tokens are handled by the Attorney/Sender dropdowns, not manual typing.
const ATTORNEY_TOKENS = ['Scheduling Link', 'Attorney Name', 'Attorney Bio'];
const SIGNATURE_TOKEN = 'Signature';

let currentAttorneyEmail = '';
let currentSenderEmail = '';

function openTemplate(catName, id){
  const t = findTemplate(catName, id);
  if (!t) return;
  recordRecent(catName, id);
  currentTemplate = { ...t, category: catName };
  currentFillIns = {};
  currentAttorneyEmail = '';
  currentSenderEmail = '';

  if (currentTemplate.variants){
    // No variant chosen yet — the modal opens showing only the variant
    // picker until one is selected, since each option is a fully
    // different email (different attorney, different referral list).
    currentTemplate.subject = '';
    currentTemplate.body = '';
    renderModal([]);
  } else {
    const placeholders = extractPlaceholders(t.subject + '\n' + t.body);
    renderModal(placeholders);
  }
  document.getElementById('overlay').classList.add('open');
}

function selectReferralVariant(name){
  const variant = (currentTemplate.variants || []).find(v => v.name === name);
  if (!variant) return;
  currentTemplate.subject = variant.subject;
  currentTemplate.body = variant.body;
  currentFillIns = {};
  currentSenderEmail = '';

  const placeholders = extractPlaceholders(variant.subject + '\n' + variant.body);
  renderModal(placeholders);

  // Auto-select the matching sender (Katie's variants → Katie's signature, etc.)
  // so the right person's name goes out without a second manual step.
  if (variant.senderHint){
    const sel = document.getElementById('senderSelect');
    if (sel){
      sel.value = variant.senderHint;
      selectSender(variant.senderHint);
    }
  }
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

function renderModal(placeholders){
  const t = currentTemplate;
  const variantHtml = t.variants ? `
    <div class="field-group" style="margin-top:16px;">
      <label>Referral Type</label>
      <select id="variantSelect" onchange="selectReferralVariant(this.value)" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;background:#FDFCFA;">
        <option value="">— Choose which referral —</option>
        ${t.variants.map(v => `<option value="${esc(v.name)}" ${v.body === t.body ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}
      </select>
    </div>
  ` : '';

  // If this is a variant template and nothing's been picked yet, show only
  // the picker — there's no email to preview or send until one is chosen.
  if (t.variants && !t.body){
    document.getElementById('modalContent').innerHTML = `
      <div class="modal-head">
        <div>
          <div class="modal-cat">${esc(t.category)}</div>
          <h3>${esc(t.name)}</h3>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      ${variantHtml}
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Each option is a different, fully-written email — pick one to preview it.</div>
    `;
    return;
  }

  const needsAttorney = placeholders.some(p => ATTORNEY_TOKENS.includes(p));
  const needsSignature = placeholders.includes(SIGNATURE_TOKEN);
  const manualPlaceholders = placeholders.filter(p => !ATTORNEY_TOKENS.includes(p) && p !== SIGNATURE_TOKEN);

  const attorneys = (DATA && DATA.attorneys) || [];
  const senders = (DATA && DATA.senders) || [];

  const attorneyHtml = needsAttorney ? `
    <div class="field-group">
      <label>Scheduling with</label>
      <select id="attorneySelect" onchange="selectAttorney(this.value)" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;background:#FDFCFA;">
        <option value="">— Choose an attorney —</option>
        ${attorneys.map(a => `<option value="${esc(a.name)}">${esc(a.name)}</option>`).join('')}
      </select>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Auto-fills their scheduling link and bio, and adds them to CC.</div>
    </div>
  ` : '';

  const senderHtml = `
    <div class="field-group">
      <label>Sending as</label>
      <select id="senderSelect" onchange="selectSender(this.value)" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;background:#FDFCFA;">
        <option value="">— Choose who's sending —</option>
        ${senders.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}
      </select>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">Excludes you from your own BCC. After opening Gmail, click <b>Insert signature</b> in the compose toolbar to add your real signature.</div>
    </div>
  `;

  const fillInsHtml = manualPlaceholders.length ? `
    <div class="fillins">
      <div class="fillins-title">Fill in before sending</div>
      ${manualPlaceholders.map(p => `
        <div class="field-group">
          <label>${esc(p)}</label>
          <input type="text" data-placeholder="${esc(p)}" oninput="updateFillIn('${esc(p).replace(/'/g,"\\'")}', this.value)" placeholder="Type ${esc(p).toLowerCase()}…">
        </div>
      `).join('')}
    </div>
  ` : '';

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-head">
      <div>
        <div class="modal-cat">${esc(t.category)}</div>
        <h3>${esc(t.name)}</h3>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="field-group" style="margin-top:16px;">
      <label>Send to (optional — you can also add this in Gmail)</label>
      <input type="email" id="toField" placeholder="client@email.com" oninput="renderPreview()">
    </div>

    ${variantHtml}
    ${attorneyHtml}
    ${senderHtml}
    ${fillInsHtml}

    <div class="preview" id="previewBox"></div>

    <div class="field-group" style="margin-top:16px;">
      <label style="display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer;margin-bottom:3px;">
        <input type="checkbox" id="teamBccCheck" style="width:auto;">
        Also BCC the entire team
      </label>
      <div style="font-size:12px;color:var(--ink-soft);margin-left:26px;">Adds every team member's email to BCC on this message.</div>
    </div>

    <div style="font-size:12px;color:var(--ink-soft);margin-top:14px;margin-bottom:14px;padding-top:14px;border-top:1px solid var(--rule);">
      Every email automatically BCCs the office.${needsAttorney ? ' Selecting an attorney above adds them to CC.' : ''}
    </div>

    <div class="modal-actions">
      <button class="primary" onclick="openInGmail()">✉ Open in Gmail</button>
      <button class="secondary" onclick="copyBody()">Copy Body</button>
    </div>
    <div class="copied-msg" id="copiedMsg">Copied to clipboard.</div>
  `;
  renderPreview();
}

function selectAttorney(name){
  const attorneys = (DATA && DATA.attorneys) || [];
  const a = attorneys.find(x => x.name === name);
  if (!a){
    currentFillIns['Scheduling Link'] = '';
    currentFillIns['Attorney Name'] = '';
    currentFillIns['Attorney Bio'] = '';
    currentAttorneyEmail = '';
  } else {
    currentFillIns['Scheduling Link'] = a.calendly || '';
    currentFillIns['Attorney Name'] = a.name || '';
    currentFillIns['Attorney Bio'] = a.bio || '';
    currentAttorneyEmail = a.email || '';
  }
  renderPreview();
}

function selectSender(name){
  const senders = (DATA && DATA.senders) || [];
  const s = senders.find(x => x.name === name);
  currentSenderEmail = s ? (s.email || '') : '';
  renderPreview();
}

function updateFillIn(key, value){
  currentFillIns[key] = value;
  renderPreview();
}

function highlightUnfilled(text, placeholders){
  let out = esc(text);
  placeholders.forEach(p => {
    if (!currentFillIns[p]){
      out = out.split('[' + esc(p) + ']').join('<span class="placeholder-fill">[' + esc(p) + ']</span>');
    }
  });
  return out;
}

function renderPreview(){
  const t = currentTemplate;
  if (!t) return;
  const placeholders = extractPlaceholders(t.subject + '\n' + t.body);
  const subj = applyFillIns(t.subject, currentFillIns);
  const body = applyFillIns(t.body, currentFillIns);

  document.getElementById('previewBox').innerHTML = `
    <div class="psubject">${highlightUnfilled(subj, placeholders)}</div>
    <div class="pbody">${highlightUnfilled(body, placeholders)}</div>
  `;
}

function getUnfilledPlaceholders(excludeTokens){
  excludeTokens = excludeTokens || [];
  const t = currentTemplate;
  const placeholders = extractPlaceholders(t.subject + '\n' + t.body);
  return placeholders.filter(p => !excludeTokens.includes(p) && !currentFillIns[p]);
}

function buildBccList(){
  const always = ((DATA && DATA.alwaysBcc) || []).filter(Boolean);
  const teamChecked = document.getElementById('teamBccCheck') && document.getElementById('teamBccCheck').checked;
  const teamEmails = teamChecked
    ? ((DATA && DATA.senders) || []).map(s => s.email).filter(Boolean)
    : [];
  const combined = [...always, ...teamEmails]
    .map(e => e.trim())
    .filter(Boolean)
    // de-dupe case-insensitively, and always exclude the current sender's own address
    .filter((email, idx, arr) =>
      arr.findIndex(e => e.toLowerCase() === email.toLowerCase()) === idx &&
      email.toLowerCase() !== (currentSenderEmail || '').toLowerCase()
    );
  return combined;
}

function openInGmail(){
  const unfilled = getUnfilledPlaceholders();
  if (unfilled.length){
    alert('Before sending, please fill in the following:\n\n' + unfilled.map(p => '• ' + p).join('\n') +
      '\n\nCheck that you\'ve selected an attorney above if this template needs one, and filled in every highlighted field in the preview.');
    return;
  }
  const t = currentTemplate;
  const to = (document.getElementById('toField').value || '').trim();
  const subj = applyFillIns(t.subject, currentFillIns);
  const body = applyFillIns(t.body, currentFillIns);
  // No confidentiality notice appended here — it's already part of
  // everyone's real Gmail signature, which gets added manually via
  // "Insert signature." Adding it here too would duplicate it.
  const bccList = buildBccList();

  const params = new URLSearchParams({
    view: 'cm',
    to: to,  // always included, even if empty, so Gmail shows a clean labeled "To" field rather than a possibly ambiguous layout when it's omitted
    su: subj, body: body
  });
  if (currentAttorneyEmail) params.set('cc', currentAttorneyEmail);
  if (bccList.length) params.set('bcc', bccList.join(','));

  const url = 'https://mail.google.com/mail/?' + params.toString();
  window.open(url, '_blank');
}

function copyBody(){
  const unfilled = getUnfilledPlaceholders();
  if (unfilled.length){
    alert('Before copying, please fill in the following:\n\n' + unfilled.map(p => '• ' + p).join('\n') +
      '\n\nCheck that you\'ve selected an attorney above if this template needs one, and filled in every highlighted field in the preview.');
    return;
  }
  const t = currentTemplate;
  // Copy Body intentionally does NOT append the confidentiality notice,
  // matching the original request — copying is meant to grab just the
  // core message text.
  const body = applyFillIns(t.body, currentFillIns).trim();
  navigator.clipboard.writeText(body).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'block';
    setTimeout(() => { msg.style.display = 'none'; }, 2000);
  });
}

document.getElementById('overlay').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});
</script>
<script>
let manageMode = false;
let manageData = null;

function toggleManage(){
  manageMode = !manageMode;
  document.getElementById('templateList').style.display = manageMode ? 'none' : '';
  document.querySelector('.topbar').style.display = manageMode ? 'none' : '';
  document.getElementById('manageWrap').style.display = manageMode ? '' : 'none';
  if (manageMode){
    manageData = JSON.parse(JSON.stringify(DATA)); // working copy
    if (!manageData.attorneys) manageData.attorneys = [];
    if (!manageData.senders) manageData.senders = [];
    if (!manageData.alwaysBcc) manageData.alwaysBcc = [];
    if (!manageData.quickLinks) manageData.quickLinks = [];
    renderManage();
  }
}

function renderManage(){
  const host = document.getElementById('manageWrap');
  host.innerHTML = `
    <div class="topbar">
      <h2 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;margin:0;">Manage Templates</h2>
      <button class="manage-link" onclick="toggleManage()">✕ Close</button>
    </div>
    <p style="color:var(--ink-soft);font-size:13px;max-width:70ch;line-height:1.6;margin-bottom:16px;">
      Edit anything below, then click <b>Download templates.json</b> at the bottom. Upload that file to the same GitHub folder as this page (replacing the old one) and commit — that updates everything for everyone who uses this page, not just your browser.
      Use square brackets like <code>[Client First Name]</code> for anything a staff member should type in before sending. <code>[Scheduling Link]</code>, <code>[Attorney Name]</code>, and <code>[Attorney Bio]</code> are filled automatically by the attorney dropdown below — don't make staff type those. Same for <code>[Signature]</code>, filled by the sender dropdown.
    </p>

    <div style="background:var(--teal-bg);border:1px solid var(--teal);border-radius:8px;padding:16px 18px;margin-bottom:24px;">
      <div style="font-weight:600;font-size:14px;margin-bottom:6px;">Upload templates.json</div>
      <p style="color:var(--ink-soft);font-size:13px;line-height:1.5;margin:0 0 12px;">
        Adding a batch of new templates? Upload a templates.json file here and it'll be merged into what's below — nothing already here gets removed. Useful if you've prepared new templates elsewhere (e.g. with help drafting them) and just want to drop them in.
      </p>
      <input type="file" id="uploadTemplatesInput" accept=".json" onchange="handleTemplatesUpload(this.files[0])" style="font-size:13px;">
      <div id="uploadMsg" style="font-size:12px;margin-top:8px;display:none;"></div>
    </div>

    <h2 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);">Quick Links</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 14px;">The shortcut buttons shown at the top of the page. Each opens in a new tab.</p>
    <div id="manageQuickLinks"></div>
    <button class="secondary" onclick="addQuickLink()" style="margin-top:6px;">+ Add Link</button>

    <h2 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--navy);margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);">Attorneys</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 14px;">Each attorney's scheduling link, bio, and CC email — filled in automatically when a staff member picks them from the "Scheduling with" dropdown.</p>
    <div id="manageAttorneys"></div>
    <button class="secondary" onclick="addAttorney()" style="margin-top:6px;">+ Add Attorney</button>

    <h2 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--navy);margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);">Senders & Signatures</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 14px;">Whoever's sending picks their name from the "Sending as" dropdown, and their exact signature block gets inserted — paste it exactly as you want it to appear, line breaks and all.</p>
    <div id="manageSenders"></div>
    <button class="secondary" onclick="addSender()" style="margin-top:6px;">+ Add Sender</button>

    <h2 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--navy);margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);">Always BCC</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin:0 0 14px;">These addresses are BCC'd on every single email sent from this tool, automatically — no dropdown needed.</p>
    <div id="manageBcc"></div>
    <button class="secondary" onclick="addBcc()" style="margin-top:6px;">+ Add BCC Address</button>

    <div class="perforation" style="height:1px;background:var(--rule);margin:32px 0;"></div>

    <h2 style="font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--navy);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule);">Templates</h2>
    <div id="manageCategories"></div>
    <button class="secondary" onclick="addCategory()" style="margin-top:10px;">+ Add Category</button>
    <div class="perforation" style="height:1px;background:var(--rule);margin:28px 0;"></div>
    <button class="primary" style="max-width:320px;" onclick="downloadTemplatesJson()">⬇ Download templates.json</button>
  `;
  renderManageCategories();
  renderManageQuickLinks();
  renderManageAttorneys();
  renderManageSenders();
  renderManageBcc();
}

    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" value="${esc(l.name)}" oninput="updateQuickLinkField(${i},'name',this.value)" placeholder="Name" style="width:160px;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;">
      <input type="text" value="${esc(l.url)}" oninput="updateQuickLinkField(${i},'url',this.value)" placeholder="https://…" style="flex:1;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;">
      <button class="secondary" onclick="deleteQuickLink(${i})" style="border-color:var(--rust);color:var(--rust);padding:9px 14px;">✕</button>

function updateQuickLinkField(i, field, val){ manageData.quickLinks[i][field] = val; }
function deleteQuickLink(i){ manageData.quickLinks.splice(i,1); renderManageQuickLinks(); }
function addQuickLink(){ manageData.quickLinks.push({name:'New Link', url:'https://'}); renderManageQuickLinks(); }

    <div style="border:1px solid var(--rule);border-radius:8px;padding:14px;margin-bottom:10px;background:#FBFAF6;">
      <div class="field-group"><label>Name</label>
        <input type="text" value="${esc(a.name)}" oninput="updateAttorneyField(${i},'name',this.value)"></div>
      <div class="field-group"><label>Email (used for CC)</label>

      <div class="field-group"><label>Bio Paragraph</label>
        <textarea rows="3" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:13px;" oninput="updateAttorneyField(${i},'bio',this.value)">${esc(a.bio)}</textarea></div>
      <button class="secondary" onclick="deleteAttorney(${i})" style="border-color:var(--rust);color:var(--rust);">Delete Attorney</button>

function updateAttorneyField(i, field, val){ manageData.attorneys[i][field] = val; }
function deleteAttorney(i){ manageData.attorneys.splice(i,1); renderManageAttorneys(); }
function addAttorney(){ manageData.attorneys.push({name:'New Attorney', email:'', calendly:'', bio:''}); renderManageAttorneys(); }

  host.innerHTML = manageData.senders.map((s, i) => `
    <div style="border:1px solid var(--rule);border-radius:8px;padding:14px;margin-bottom:10px;background:#FBFAF6;">
      <div class="field-group"><label>Name</label>
        <input type="text" value="${esc(s.name)}" oninput="updateSenderField(${i},'name',this.value)"></div>
      <div class="field-group"><label>Email (used to skip BCC'ing themselves)</label>
        <input type="email" value="${esc(s.email||'')}" oninput="updateSenderField(${i},'email',this.value)"></div>
      <div class="field-group"><label>Signature Block</label>
        <textarea rows="4" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:13px;" oninput="updateSenderField(${i},'signature',this.value)">${esc(s.signature)}</textarea></div>
      <button class="secondary" onclick="deleteSender(${i})" style="border-color:var(--rust);color:var(--rust);">Delete Sender</button>

function updateSenderField(i, field, val){ manageData.senders[i][field] = val; }
function deleteSender(i){ manageData.senders.splice(i,1); renderManageSenders(); }
function addSender(){ manageData.senders.push({name:'New Sender', email:'', signature:''}); renderManageSenders(); }

function renderManageBcc(){
  const host = document.getElementById('manageBcc');
  host.innerHTML = manageData.alwaysBcc.map((email, i) => `
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="email" value="${esc(email)}" oninput="updateBccField(${i},this.value)" style="flex:1;padding:9px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:14px;">
      <button class="secondary" onclick="deleteBcc(${i})" style="border-color:var(--rust);color:var(--rust);padding:9px 14px;">✕</button>
    </div>

function updateBccField(i, val){ manageData.alwaysBcc[i] = val; }
function deleteBcc(i){ manageData.alwaysBcc.splice(i,1); renderManageBcc(); }
function addBcc(){ manageData.alwaysBcc.push(''); renderManageBcc(); }

function handleTemplatesUpload(file){
  if (!file) return;
  const msgEl = document.getElementById('uploadMsg');
  const showMsg = (text, isError) => {
    msgEl.style.display = 'block';
    msgEl.style.color = isError ? 'var(--rust)' : 'var(--teal)';
    msgEl.textContent = text;
  };

  file.text().then(text => {
    let incoming;
    try { incoming = JSON.parse(text); }
    catch(e){ showMsg('That file isn\'t valid JSON — check it\'s an unedited templates.json export.', true); return; }

    if (!incoming || !Array.isArray(incoming.categories)){
      showMsg('That file doesn\'t look like a templates.json file (missing "categories").', true); return;
    }

    const existingIds = new Set(
      manageData.categories.flatMap(c => c.templates.map(t => t.id))
    );
    let addedCount = 0, newCategoryCount = 0;

    incoming.categories.forEach(incCat => {
      if (!incCat.name || !Array.isArray(incCat.templates)) return;
      let targetCat = manageData.categories.find(c => c.name.toLowerCase() === incCat.name.toLowerCase());
      if (!targetCat){
        targetCat = { name: incCat.name, templates: [] };
        manageData.categories.push(targetCat);
        newCategoryCount++;
      }
      incCat.templates.forEach(t => {
        if (!t.name) return;
        let id = t.id || ('template-' + Date.now() + '-' + Math.random().toString(36).slice(2,7));
        while (existingIds.has(id)){
          id = id + '-' + Math.random().toString(36).slice(2,5);
        }
        existingIds.add(id);
        targetCat.templates.push({ id, name: t.name, subject: t.subject || '', body: t.body || '' });
        addedCount++;
      });
    });

    showMsg(`Added ${addedCount} template${addedCount===1?'':'s'}${newCategoryCount ? ` (including ${newCategoryCount} new categor${newCategoryCount===1?'y':'ies'})` : ''}. Don't forget to click "Download templates.json" below to save this.`, false);
    document.getElementById('uploadTemplatesInput').value = '';
    renderManageCategories();
  }).catch(() => showMsg('Could not read that file.', true));
}

function renderManageCategories(){
  const host = document.getElementById('manageCategories');
  host.innerHTML = manageData.categories.map((cat, ci) => `
    <div class="panel-card" style="background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px;margin-bottom:16px;">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;">
        <input type="text" value="${esc(cat.name)}" oninput="updateCategoryName(${ci}, this.value)" style="flex:1;font-weight:600;font-size:16px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;">
        <button class="secondary" onclick="deleteCategory(${ci})" style="padding:8px 12px;border-color:var(--rust);color:var(--rust);">Delete Category</button>
      </div>
      ${cat.templates.map((t, ti) => `
        <div style="border:1px solid var(--rule);border-radius:8px;padding:14px;margin-bottom:10px;background:#FBFAF6;">
          <div class="field-group">
            <label>Template Name</label>
            <input type="text" value="${esc(t.name)}" oninput="updateTemplateField(${ci},${ti},'name',this.value)">
          </div>
          ${t.variants ? `
            <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">This template has multiple variants (a dropdown picks which one loads) — edit each below.</div>
            ${t.variants.map((v, vi) => `
              <div style="border:1px solid var(--rule);border-radius:6px;padding:12px;margin-bottom:8px;background:var(--panel);">
                <div class="field-group">
                  <label>Variant Name (shown in the dropdown)</label>
                  <input type="text" value="${esc(v.name)}" oninput="updateVariantField(${ci},${ti},${vi},'name',this.value)">
                </div>
                <div class="field-group">
                  <label>Sender Hint (auto-selects this sender when chosen — must match a Sender name exactly, or leave blank)</label>
                  <input type="text" value="${esc(v.senderHint||'')}" oninput="updateVariantField(${ci},${ti},${vi},'senderHint',this.value)">
                </div>
                <div class="field-group">
                  <label>Subject</label>
                  <input type="text" value="${esc(v.subject)}" oninput="updateVariantField(${ci},${ti},${vi},'subject',this.value)">
                </div>
                <div class="field-group">
                  <label>Body</label>
                  <textarea rows="6" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:13px;" oninput="updateVariantField(${ci},${ti},${vi},'body',this.value)">${esc(v.body)}</textarea>
                </div>
                <button class="secondary" onclick="deleteVariant(${ci},${ti},${vi})" style="border-color:var(--rust);color:var(--rust);">Delete This Variant</button>
              </div>
            `).join('')}
            <button class="secondary" onclick="addVariant(${ci},${ti})">+ Add Variant</button>
          ` : `
            <div class="field-group">
              <label>Subject</label>
              <input type="text" value="${esc(t.subject)}" oninput="updateTemplateField(${ci},${ti},'subject',this.value)">
            </div>
            <div class="field-group">
              <label>Body</label>
              <textarea rows="6" style="width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;font-family:'Poppins',sans-serif;font-size:13px;" oninput="updateTemplateField(${ci},${ti},'body',this.value)">${esc(t.body)}</textarea>
            </div>
          `}
          <button class="secondary" onclick="deleteTemplate(${ci},${ti})" style="border-color:var(--rust);color:var(--rust);margin-top:8px;">Delete Template</button>
        </div>
      `).join('')}
      <button class="secondary" onclick="addTemplate(${ci})">+ Add Template to This Category</button>
    </div>
  `).join('');
}

function updateVariantField(ci, ti, vi, field, val){
  manageData.categories[ci].templates[ti].variants[vi][field] = val;
}
function deleteVariant(ci, ti, vi){
  manageData.categories[ci].templates[ti].variants.splice(vi, 1);
  renderManageCategories();
}
function addVariant(ci, ti){
  manageData.categories[ci].templates[ti].variants.push({ name: 'New Variant', senderHint: '', subject: '', body: '' });
  renderManageCategories();
}

function updateCategoryName(ci, val){ manageData.categories[ci].name = val; }
function deleteCategory(ci){
  if (!confirm('Delete this whole category and its templates?')) return;
  manageData.categories.splice(ci, 1);
  renderManageCategories();
}
function addCategory(){
  manageData.categories.push({ name: 'New Category', templates: [] });
  renderManageCategories();
}
function updateTemplateField(ci, ti, field, val){
  manageData.categories[ci].templates[ti][field] = val;
}
function deleteTemplate(ci, ti){
  manageData.categories[ci].templates.splice(ti, 1);
  renderManageCategories();
}
function addTemplate(ci){
  const id = 'template-' + Date.now();
  manageData.categories[ci].templates.push({ id, name: 'New Template', subject: '', body: '' });
  renderManageCategories();
}

function downloadTemplatesJson(){
  const blob = new Blob([JSON.stringify(manageData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'templates.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  DATA = JSON.parse(JSON.stringify(manageData)); // reflect changes immediately in this session too
}
</script>
